name: Update local card catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_card_catalog.py
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- data/; then
            echo "Catalog is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/card_catalog.sqlite3.gz data/card_catalog.sqlite3.json
          git commit -m "Update local card catalog"
          git push
