name: Daily card price refresh

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wake the free backend
        run: |
          curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 15 \
            https://pokemon-collection-f4wv.onrender.com/cards > /dev/null

      - name: Start price refresh
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 10 \
            -X POST \
            https://pokemon-collection-f4wv.onrender.com/maintenance/refresh-prices
          sleep 5

      - name: Wait for completion
        run: |
          for attempt in $(seq 1 60); do
            status=$(curl --fail --silent --show-error \
              --retry 2 --retry-all-errors --retry-delay 5 \
              https://pokemon-collection-f4wv.onrender.com/maintenance/refresh-prices/status)
            echo "$status"
            if echo "$status" | grep -q '"running":false'; then
              if echo "$status" | grep -q '"error":""'; then
                exit 0
              fi
              exit 1
            fi
            sleep 10
          done
          echo "Daily price refresh timed out"
          exit 1
