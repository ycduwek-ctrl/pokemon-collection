name: Daily card price refresh

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wake the free backend
        run: |
          curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 15 \
            https://pokemon-collection-f4wv.onrender.com/cards > /dev/null

      - name: Refresh every gallery card
        run: |
          for batch in $(seq 1 100); do
            response=$(curl --fail --silent --show-error \
              --max-time 120 \
              --retry 3 --retry-all-errors --retry-delay 10 \
              -X POST \
              "https://pokemon-collection-f4wv.onrender.com/maintenance/refresh-prices?limit=4")
            echo "$response"
            if echo "$response" | grep -q '"ok":false'; then
              exit 1
            fi
            if echo "$response" | grep -q '"remaining":0'; then
              exit 0
            fi
            sleep 3
          done
          echo "Daily price refresh did not finish all cards"
          exit 1
